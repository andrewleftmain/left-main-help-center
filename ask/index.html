<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask — Left Main Help Center</title>
<meta name="description" content="Ask a question about Left Main and get an answer sourced from the help center.">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--bg-muted); }
  .chat-shell { max-width: 760px; margin: 0 auto; padding: max(32px, env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) 40px max(20px, env(safe-area-inset-left,0px)); display: flex; flex-direction: column; min-height: 100dvh; box-sizing: border-box; }
  .chat-header { text-align: center; margin-bottom: 18px; }
  .chat-header a { font-size: 13px; color: var(--fg-muted); text-decoration: none; }
  .chat-header a:hover { color: var(--accent); }
  .chat-header h1 { font-size: 22px; margin: 8px 0 4px; }
  .chat-header p { color: var(--fg-muted); font-size: 14px; margin: 0; }

  .chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 4px 2px 20px; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: var(--r-lg); font-size: 15px; line-height: 1.55; }
  .msg.user { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: var(--r-sm); }
  .msg.bot { align-self: flex-start; background: var(--bg-raised); border: 1px solid var(--border); border-bottom-left-radius: var(--r-sm); box-shadow: var(--shadow-card); }
  .msg.bot.loading { color: var(--fg-meta); font-style: italic; }
  .msg.bot a { color: var(--accent); }
  .msg.error { background: color-mix(in srgb, #b3261e 10%, var(--bg)); border: 1px solid #b3261e; color: #b3261e; }
  .msg p { margin: 0 0 .6em; }
  .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 0 0 .6em 1.2em; padding: 0; }

  .chat-form { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 14px; }
  .chat-input { flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-pill); font-size: 15px; font-family: var(--font-body); background: var(--bg-raised); color: var(--fg); }
  .chat-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chat-send { padding: 0 22px; border: 0; border-radius: var(--r-pill); background: var(--accent-cta); color: var(--accent-cta-ink); font-family: var(--font-display); font-weight: 600; font-size: 14px; cursor: pointer; }
  .chat-send:hover { background: var(--accent-cta-hover); }
  .chat-send:disabled { opacity: .5; cursor: default; }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .suggestion { border: 1px solid var(--border); background: var(--bg-raised); border-radius: var(--r-pill); padding: 7px 14px; font-size: 13px; color: var(--fg); cursor: pointer; }
  .suggestion:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="chat-shell">
  <div class="chat-header">
    <a href="../index.html">&larr; Left Main Help Center</a>
    <h1>Ask a question</h1>
    <p>Answers are generated from the help center articles — not a replacement for support on anything account-specific.</p>
  </div>

  <div class="suggestions" id="suggestions">
    <button class="suggestion" data-q="How do I stop a cadence?">How do I stop a cadence?</button>
    <button class="suggestion" data-q="What's the difference between Cadence Libraries and Folders?">Libraries vs. Folders?</button>
    <button class="suggestion" data-q="How do I create a direct mail follow-up sequence?">Direct mail follow-up sequence?</button>
    <button class="suggestion" data-q="What is DispoSignals?">What is DispoSignals?</button>
  </div>

  <div class="chat-log" id="chatLog"></div>

  <form class="chat-form" id="chatForm">
    <input class="chat-input" id="chatInput" type="text" placeholder="Ask about Left Main…" autocomplete="off">
    <button class="chat-send" id="chatSend" type="submit">Send</button>
  </form>
</div>

<script>
(function () {
  "use strict";
  const WORKER_URL = localStorage.getItem("lm_ask_worker_url") || "https://left-main-help-bot.YOUR-SUBDOMAIN.workers.dev";

  const log = document.getElementById("chatLog");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("chatSend");
  const suggestions = document.getElementById("suggestions");
  let history = [];

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Minimal markdown: paragraphs, **bold**, [text](url), bullet lists.
  function renderMarkdown(text) {
    const escaped = escapeHtml(text);
    const withLinks = escaped.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    const withBold = withLinks.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    const lines = withBold.split("\n");
    let html = "";
    let inList = false;
    for (const line of lines) {
      const trimmed = line.trim();
      if (/^[-*]\s+/.test(trimmed)) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += `<li>${trimmed.replace(/^[-*]\s+/, "")}</li>`;
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        if (trimmed) html += `<p>${trimmed}</p>`;
      }
    }
    if (inList) html += "</ul>";
    return html || `<p>${withBold}</p>`;
  }

  function addMessage(role, text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "bot") + (cls ? " " + cls : "");
    if (role === "user") {
      div.textContent = text;
    } else {
      div.innerHTML = renderMarkdown(text);
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function ask(question) {
    suggestions.style.display = "none";
    addMessage("user", question);
    const loadingEl = addMessage("bot", "Thinking…", "loading");
    input.value = "";
    sendBtn.disabled = true;

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: question, history }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      loadingEl.remove();
      addMessage("bot", data.answer);
      history.push({ role: "user", content: question });
      history.push({ role: "assistant", content: data.answer });
    } catch (e) {
      loadingEl.remove();
      addMessage("bot", "Something went wrong: " + e.message, "error");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (q) ask(q);
  });

  suggestions.addEventListener("click", (e) => {
    const btn = e.target.closest(".suggestion");
    if (btn) ask(btn.dataset.q);
  });
})();
</script>
</body>
</html>
